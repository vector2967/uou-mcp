[project]
name = "uou-mcp"
version = "0.1.0"
description = "울산대학교(UOU) 학식·학사일정·공지·학과·트랙·도서관 정보를 AI에게 주는 MCP 서버 (비공식)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "pypdf>=6.0",
]

[project.scripts]
uou-mcp = "uou_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uou_mcp"]
